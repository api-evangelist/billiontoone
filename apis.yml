aid: billiontoone
name: BillionToOne
description: BillionToOne is a molecular diagnostics company using proprietary single-molecule
  Quantitative Counting Template (QCT) technology to detect disease at the DNA level from
  cell-free DNA. Its Unity prenatal screening suite (Unity Complete, Unity Confirm, and Unity
  fetal antigen tests) delivers non-invasive prenatal testing from maternal blood at nine weeks,
  and its Northstar oncology line (Northstar Select and Northstar Response) provides liquid-biopsy
  therapy selection and real-time treatment-response monitoring. BillionToOne integrates with
  electronic medical records through a collaboration with Epic and delivers results through its
  provider and patient portals. It was added to the API Evangelist network as a portfolio company
  of 500 Global, Norwest Venture Partners, and Y Combinator.
